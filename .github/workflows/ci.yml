name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install & Build Client
        run: |
          cd client
          npm ci
          npm run build

      - name: Install & Verify Server Syntax
        run: |
          cd server
          npm ci
          node -c server.js
          node -c controllers/courseController.js
          node -c services/aiService.js
          node -c services/youtubeService.js
